# gitleaks v8 config: default rules plus the skips this repo intended.
title = "ai-job-tracker"

[extend]
useDefault = true

[[allowlists]]
description = "Lockfiles, vendored dependencies and build output"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)node_modules/''',
  '''(^|/)(dist|build|coverage)/''',
]

[[allowlists]]
description = "Obvious test placeholders in docs and tests (e.g. gsk_test123), never real keys"
regexTarget = "secret"
regexes = [
  '''(?i)^[a-z]+_test[a-z0-9_]*$''',
  '''(?i)your_?[a-z_]*token[a-z_]*''',
]
