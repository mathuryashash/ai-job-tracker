services:
  postgres:
    image: pgvector/pgvector:16-pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/resume_tracker
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - FERNET_KEY=${FERNET_KEY}
      - USAJOBS_EMAIL=${USAJOBS_EMAIL}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    # Single worker: LangGraph pipeline holds module-level singletons (embedding
    # model, StateGraph); multi-worker would duplicate them in memory without
    # any concurrency benefit.
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    restart: always
    depends_on:
      - backend

  # Optional: Streamlit alternative UI
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["streamlit"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
